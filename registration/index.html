<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration | KVJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reg-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reg-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reg-header img {
            height: 40px;
            margin-bottom: 20px;
        }

        .reg-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .reg-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-control:read-only {
            background: #f1f5f9;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #334155;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #0f172a;
        }

        .success-msg {
            display: none;
            text-align: center;
            color: #10b981;
            font-weight: 600;
            margin-top: 20px;
            padding: 15px;
            background: #ecfdf5;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="reg-card">
        <div class="reg-header">
            <img src="Kvj logo.jpeg" alt="KVJ Logo">
            <h1>Student Registration</h1>
            <p>Please enter your details to enroll in the course.</p>
        </div>

        <form id="registrationForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="courseName">Selected Course</label>
                <select id="courseName" class="form-control" required>
                    <option value="" disabled selected>Select a Course</option>
                    <option value="Power BI">Power BI</option>
                    <option value="Excel">Excel</option>
                    <option value="AI">AI</option>
                    <option value="Data Analytics">Data Analytics</option>
                    <option value="Python">Python</option>
                    <option value="SQL">SQL</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="e.g. rahul@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="e.g. +91 98765 43210" required>
            </div>

            <div class="form-group">
                <label for="branch">Branch / Specialization (Optional)</label>
                <input type="text" id="branch" class="form-control" placeholder="e.g. Computer Science">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Registration</button>
        </form>

        <div id="successMsg" class="success-msg">
            ✓ Registration Successful! Welcome to the course.
        </div>

    </div>

    <script>
        // REPLACE THIS with your deployed Google Apps Script URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxf3GLchQbb8ltPLw-awGLWz-N8WelAQPl_vWdvwGFi4hkNJO5qZJmGprnG7CWHBPZa/exec";

        // Get course from URL
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const course = params.get('course');
            if (course) {
                // Try to set the dropdown value if it matches one of the options
                const select = document.getElementById('courseName');
                const decodedCourse = decodeURIComponent(course);

                // Check if the decoded course exists in the dropdown options
                let matchFound = false;
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === decodedCourse) {
                        select.value = decodedCourse;
                        matchFound = true;
                        break;
                    }
                }

                // If no match found and it's not empty, we could add it or fallback
                if (!matchFound && decodedCourse) {
                    console.warn("Course from URL not found in dropdown options:", decodedCourse);
                }
            }

            // Pre-fill info from session/local storage if available
            const savedName = sessionStorage.getItem('userName') || localStorage.getItem('strategist_user');
            const savedEmail = localStorage.getItem('gmail');
            const savedPhone = localStorage.getItem('strategist_phone');

            if (savedName && savedName !== 'User') {
                document.getElementById('fullName').value = savedName;
            }

            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('email').readOnly = true;
                document.getElementById('email').style.backgroundColor = '#f1f5f9';
            }

            if (savedPhone) {
                document.getElementById('phone').value = savedPhone;
                document.getElementById('phone').readOnly = true;
                document.getElementById('phone').style.backgroundColor = '#f1f5f9';
            }
        });

        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const form = document.getElementById('registrationForm');
            const msg = document.getElementById('successMsg');

            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                branch: document.getElementById('branch').value || "N/A",
                course: document.getElementById('courseName').value,
                timestamp: new Date().toLocaleString()
            };

            btn.disabled = true;
            btn.textContent = "Processing...";

            // Save details to session storage as fallback
            sessionStorage.setItem('pendingRegistration', JSON.stringify(formData));

            try {
                // If SCRIPT_URL is provided, send data to Google Sheets
                if (SCRIPT_URL && SCRIPT_URL.startsWith("https://script.google.com")) {
                    // Using text/plain to avoid CORS preflight issues while allowing us to see the response
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (result.status === "duplicate") {
                        btn.disabled = false;
                        btn.textContent = "Submit Registration";
                        alert("Error: " + result.message);
                        return;
                    }

                    if (result.status !== "success") {
                        throw new Error(result.message || "Unknown error");
                    }
                }

                // Show success message
                form.style.display = 'none';
                msg.innerHTML = "✓ Registration Details Saved!";
                msg.style.display = 'block';

            } catch (error) {
                console.error('Error submitting form:', error);

                // If it's a CORS error (opaque response), we might still have succeeded
                // But for Google Apps Script, if we get here, something likely failed or we can't see the response
                btn.disabled = false;
                btn.textContent = "Try Again";
                alert("Submission failed. You may already be registered or there's a connection issue.");
            }
        }
    </script>
</body>

</html>
