<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVJ Advanced Python Certification - KVJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        .typing-container {
            display: inline-block;
            min-height: 2.2em;
            position: relative;
        }
        .blinking-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: var(--blue-dark);
            margin-left: 2px;
            animation: blink-caret 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink-caret {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="landing-body">
    <!-- Navbar -->
    <nav class="kvj-navbar">
        <div class="kvj-container nav-wrapper">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="index.html" class="nav-back">
                    ← Back
                </a>
                <a href="index.html" class="kvj-logo">
                    <div class="logo-box">
                        <img src="Kvj logo.jpeg" alt="KVJ" style="max-height: 45px; width: auto;">
                    </div>
                </a>
            </div>
            <div class="nav-links-right">
                <a href="roadmap.html" class="kvj-btn kvj-btn-primary">Get Started</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="kvj-hero">
        <div class="kvj-container hero-grid">
            
            <!-- Left Content -->
            <div class="hero-left fade-in-up" style="animation-delay: 0.1s;">
                <h1 class="hero-title typing-container">
                    <span id="typewriter"></span><span class="blinking-cursor"></span>
                </h1>
                
                <h2 class="hero-subtitle">
                    Master advanced Python concepts through practical, hands-on learning designed for real-world applications.
                </h2>
                
                <p class="hero-desc">
                    Build industry-ready skills with interactive projects, modern tools, and career-focused training.
                </p>
                
                <div class="hero-action">
                    <a href="roadmap.html" class="kvj-btn kvj-btn-dark">ACCESS COURSE</a>
                </div>
            </div>
            
            <!-- Right Content - Hero Image -->
            <div class="hero-right fade-in-up" style="animation-delay: 0.3s; display: flex; justify-content: center; align-items: center;">
                <div class="hero-image-wrapper" style="width: 90%; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.05); padding: 10px;">
                    <img src="woman_presenting_dashboard.png" alt="Python Analytics in Action" style="width: 100%; height: auto; border-radius: 12px; display: block; transition: transform 0.5s;">
                </div>
            </div>
            
        </div>
    </header>

    <script>
        // Typing Effect logic
        const textToType = "Step Into the Future of Python Education";
        const typewriterEl = document.getElementById('typewriter');
        let typeIndex = 0;
        
        const blueStyle = "<span class='text-blue'>";
        const tealStyle = "<span class='text-teal'>";
        const closeSpan = "</span>";
        
        const line1 = "Step Into ";
        const line2 = "the Future of<br>";
        const line3 = "Python Education";

        let fullHTML = "";

        function typeWriter() {
            if (typeIndex < line1.length) {
                fullHTML = blueStyle + line1.substring(0, typeIndex + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 40);
            } 
            else if (typeIndex < line1.length + line2.length) {
                let idx2 = typeIndex - line1.length;
                fullHTML = blueStyle + line1 + closeSpan + tealStyle + line2.substring(0, idx2 + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 40);
            }
            else if (typeIndex < line1.length + line2.length + line3.length) {
                let idx3 = typeIndex - line1.length - line2.length;
                fullHTML = blueStyle + line1 + closeSpan + tealStyle + line2 + closeSpan + blueStyle + line3.substring(0, idx3 + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 40);
            }
        }
        
        setTimeout(typeWriter, 500);
    </script>
</body>
</html>
