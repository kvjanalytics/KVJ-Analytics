<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="500" fill="#0f172a" rx="24"/>
    <text x="400" y="50" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#f8fafc" letter-spacing="1">PRODUCT PERFORMANCE COMPARISON</text>
    
    <!-- Vertical Grid Lines -->
    <line x1="150" y1="100" x2="150" y2="420" stroke="#1e293b" stroke-width="2"/>
    <line x1="280" y1="100" x2="280" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="410" y1="100" x2="410" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="540" y1="100" x2="540" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="670" y1="100" x2="670" y2="420" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- X-Axis Labels -->
    <g font-family="'Outfit', sans-serif" font-size="14" fill="#64748b" font-weight="600">
        <text x="150" y="445" text-anchor="middle">0</text>
        <text x="280" y="445" text-anchor="middle">250</text>
        <text x="410" y="445" text-anchor="middle">500</text>
        <text x="540" y="445" text-anchor="middle">750</text>
        <text x="670" y="445" text-anchor="middle">1000</text>
    </g>

    <!-- Horizontal Bars -->
    <defs>
        <linearGradient id="barGradientHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
        </linearGradient>
    </defs>

    <rect x="150" y="120" width="450" height="45" fill="url(#barGradientHoriz)" rx="8">
        <animate attributeName="width" from="0" to="450" dur="1s" fill="freeze" />
    </rect>
    <rect x="150" y="200" width="320" height="45" fill="url(#barGradientHoriz)" rx="8">
        <animate attributeName="width" from="0" to="320" dur="1s" fill="freeze" />
    </rect>
    <rect x="150" y="280" width="550" height="45" fill="url(#barGradientHoriz)" rx="8">
        <animate attributeName="width" from="0" to="550" dur="1s" fill="freeze" />
    </rect>
    <rect x="150" y="360" width="280" height="45" fill="url(#barGradientHoriz)" rx="8">
        <animate attributeName="width" from="0" to="280" dur="1s" fill="freeze" />
    </rect>

    <!-- Y-Axis Labels -->
    <g font-family="'Outfit', sans-serif" font-size="16" fill="#f8fafc" font-weight="700">
        <text x="130" y="148" text-anchor="end">Smartphones</text>
        <text x="130" y="228" text-anchor="end">Laptops</text>
        <text x="130" y="308" text-anchor="end">Tablets</text>
        <text x="130" y="388" text-anchor="end">Wearables</text>
    </g>
</svg>
