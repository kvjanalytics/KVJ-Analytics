<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <!-- Teal circle fill -->
    <radialGradient id="tealGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Violet circle fill -->
    <radialGradient id="violetGrad" cx="60%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Intersection fill -->
    <radialGradient id="intersectGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip paths for each Venn region -->
    <!-- Union small -->
    <clipPath id="clipA1"><circle cx="155" cy="195" r="52"/></clipPath>
    <clipPath id="clipB1"><circle cx="195" cy="195" r="52"/></clipPath>

    <!-- Intersection small -->
    <clipPath id="clipA2"><circle cx="370" cy="195" r="52"/></clipPath>
    <clipPath id="clipB2"><circle cx="410" cy="195" r="52"/></clipPath>

    <!-- A-B small -->
    <clipPath id="clipA3"><circle cx="580" cy="195" r="52"/></clipPath>
    <clipPath id="clipB3_inv"><circle cx="620" cy="195" r="52"/></clipPath>

    <!-- Symmetric Diff small -->
    <clipPath id="clipA4"><circle cx="790" cy="195" r="52"/></clipPath>
    <clipPath id="clipB4"><circle cx="830" cy="195" r="52"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)" rx="24"/>

  <!-- Stars -->
  <circle cx="50" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="150" cy="30" r="1" fill="white" opacity="0.4"/>
  <circle cx="800" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="850" cy="150" r="1" fill="white" opacity="0.3"/>
  <circle cx="30" cy="400" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="870" cy="500" r="1" fill="white" opacity="0.4"/>
  <circle cx="100" cy="640" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="750" cy="650" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="20" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="650" cy="40" r="1" fill="white" opacity="0.6"/>

  <!-- Title -->
  <text x="450" y="65" text-anchor="middle" fill="white" font-size="38" font-weight="800" letter-spacing="4" filter="url(#glow)">PYTHON SETS</text>
  <text x="450" y="95" text-anchor="middle" fill="#94a3b8" font-size="16" letter-spacing="2">Unique Collections &amp; Set Operations</text>

  <!-- Title underline glow -->
  <line x1="200" y1="108" x2="700" y2="108" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>

  <!-- =================== VENN DIAGRAMS ROW =================== -->

  <!-- == 1. UNION == -->
  <!-- bg cards -->
  <rect x="30" y="130" width="190" height="220" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8"/>
  <!-- Left circle A -->
  <circle cx="105" cy="225" r="60" fill="url(#tealGrad)" stroke="#5eead4" stroke-width="1.5" filter="url(#glow)" opacity="0.85"/>
  <!-- Right circle B -->
  <circle cx="145" cy="225" r="60" fill="url(#violetGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)" opacity="0.85"/>
  <!-- Label -->
  <text x="125" y="305" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">UNION</text>
  <text x="125" y="320" text-anchor="middle" fill="#64748b" font-size="10">A ∪ B</text>
  <!-- A B labels -->
  <text x="92" y="230" text-anchor="middle" fill="white" font-size="14" font-weight="700">A</text>
  <text x="158" y="230" text-anchor="middle" fill="white" font-size="14" font-weight="700">B</text>

  <!-- == 2. INTERSECTION == -->
  <rect x="240" y="130" width="190" height="220" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8"/>
  <circle cx="315" cy="225" r="60" fill="#0d9488" fill-opacity="0.3" stroke="#5eead4" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="355" cy="225" r="60" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Intersection highlight -->
  <path d="M335,165 A60,60 0 0,1 335,285 A60,60 0 0,1 335,165" fill="none"/>
  <!-- Use ellipse approximation for intersection -->
  <ellipse cx="335" cy="225" rx="25" ry="42" fill="#e879f9" fill-opacity="0.7" filter="url(#glow)"/>
  <text x="335" y="305" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">INTERSECTION</text>
  <text x="335" y="320" text-anchor="middle" fill="#64748b" font-size="10">A ∩ B</text>
  <text x="302" y="230" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700">A</text>
  <text x="368" y="230" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700">B</text>

  <!-- == 3. DIFFERENCE A-B == -->
  <rect x="450" y="130" width="190" height="220" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8"/>
  <circle cx="525" cy="225" r="60" fill="url(#tealGrad)" stroke="#5eead4" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>
  <circle cx="565" cy="225" r="60" fill="#020617" fill-opacity="0.85" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
  <text x="545" y="305" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">DIFFERENCE</text>
  <text x="545" y="320" text-anchor="middle" fill="#64748b" font-size="10">A - B</text>
  <text x="510" y="230" text-anchor="middle" fill="white" font-size="14" font-weight="700">A</text>
  <text x="578" y="230" text-anchor="middle" fill="#64748b" font-size="14" font-weight="700">B</text>

  <!-- == 4. SYMMETRIC DIFFERENCE == -->
  <rect x="660" y="130" width="210" height="220" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8"/>
  <circle cx="735" cy="225" r="60" fill="url(#tealGrad)" stroke="#5eead4" stroke-width="1.5" filter="url(#glow)" opacity="0.85"/>
  <circle cx="780" cy="225" r="60" fill="url(#violetGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)" opacity="0.85"/>
  <!-- Mask intersection with dark ellipse -->
  <ellipse cx="757" cy="225" rx="26" ry="43" fill="#020617"/>
  <text x="757" y="305" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">SYM. DIFFERENCE</text>
  <text x="757" y="320" text-anchor="middle" fill="#64748b" font-size="10">A △ B</text>
  <text x="722" y="230" text-anchor="middle" fill="white" font-size="14" font-weight="700">A</text>
  <text x="792" y="230" text-anchor="middle" fill="white" font-size="14" font-weight="700">B</text>

  <!-- =================== METHODS SECTION =================== -->
  <text x="450" y="385" text-anchor="middle" fill="#94a3b8" font-size="14" letter-spacing="3" font-weight="600">━━━  SET METHODS  ━━━</text>

  <!-- Method Cards Row 1 -->
  <!-- add() -->
  <rect x="30" y="405" width="185" height="74" rx="12" fill="#0c1a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="45" y="432" fill="#38bdf8" font-size="17" font-weight="800" font-family="monospace">add()</text>
  <text x="45" y="455" fill="#94a3b8" font-size="12">Adds a single element</text>
  <text x="45" y="470" fill="#94a3b8" font-size="12">to the set.</text>

  <!-- remove() -->
  <rect x="232" y="405" width="185" height="74" rx="12" fill="#0c1a2e" stroke="#e879f9" stroke-width="1.5"/>
  <text x="247" y="432" fill="#e879f9" font-size="17" font-weight="800" font-family="monospace">remove()</text>
  <text x="247" y="455" fill="#94a3b8" font-size="12">Removes element; raises</text>
  <text x="247" y="470" fill="#94a3b8" font-size="12">KeyError if not found.</text>

  <!-- discard() -->
  <rect x="434" y="405" width="185" height="74" rx="12" fill="#0c1a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="449" y="432" fill="#a78bfa" font-size="17" font-weight="800" font-family="monospace">discard()</text>
  <text x="449" y="455" fill="#94a3b8" font-size="12">Removes element; no</text>
  <text x="449" y="470" fill="#94a3b8" font-size="12">error if not found.</text>

  <!-- clear() -->
  <rect x="636" y="405" width="232" height="74" rx="12" fill="#0c1a2e" stroke="#5eead4" stroke-width="1.5"/>
  <text x="651" y="432" fill="#5eead4" font-size="17" font-weight="800" font-family="monospace">union() / intersection()</text>
  <text x="651" y="455" fill="#94a3b8" font-size="12">Return new sets from</text>
  <text x="651" y="470" fill="#94a3b8" font-size="12">operations on two sets.</text>

  <!-- =================== KEY PROPERTY =================== -->
  <rect x="30" y="500" width="840" height="80" rx="16" fill="#0c1a2e" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Star icon -->
  <text x="55" y="548" fill="#fbbf24" font-size="28">★</text>
  <text x="95" y="535" fill="white" font-size="16" font-weight="700">Key Property:</text>
  <text x="95" y="558" fill="#94a3b8" font-size="14">Sets store only <tspan fill="#38bdf8" font-weight="700">unique elements</tspan> — duplicates are automatically removed.</text>
  <text x="95" y="574" fill="#94a3b8" font-size="14">Sets are <tspan fill="#a78bfa" font-weight="700">unordered</tspan> and <tspan fill="#5eead4" font-weight="700">mutable</tspan>, but elements must be <tspan fill="#e879f9" font-weight="700">immutable</tspan>.</text>

  <!-- =================== CODE EXAMPLE =================== -->
  <rect x="30" y="600" width="840" height="80" rx="16" fill="#020c1b" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="627" fill="#64748b" font-size="12">Example</text>
  <text x="55" y="648" fill="#38bdf8" font-size="14" font-family="monospace">my_set = <tspan fill="#e879f9">{</tspan><tspan fill="#fbbf24">1, 2, 3, 3, 2</tspan><tspan fill="#e879f9">}</tspan>   <tspan fill="#475569"># → {1, 2, 3}</tspan>   <tspan fill="#5eead4">|</tspan>   my_set.<tspan fill="#a78bfa">add</tspan><tspan fill="#e879f9">(4)</tspan>   <tspan fill="#475569"># → {1, 2, 3, 4}</tspan></text>
  <text x="55" y="668" fill="#38bdf8" font-size="14" font-family="monospace">A = <tspan fill="#e879f9">{</tspan><tspan fill="#fbbf24">1, 2, 3</tspan><tspan fill="#e879f9">}</tspan>   <tspan fill="white">|</tspan>   B = <tspan fill="#e879f9">{</tspan><tspan fill="#fbbf24">3, 4, 5</tspan><tspan fill="#e879f9">}</tspan>   <tspan fill="white">|</tspan>   A <tspan fill="#e879f9">|</tspan> B = <tspan fill="#fbbf24">{1, 2, 3, 4, 5}</tspan>   <tspan fill="#475569"># Union</tspan></text>

  <!-- Python Logo (simplified) -->
  <circle cx="865" cy="55" r="22" fill="#1e3a5f" opacity="0.6"/>
  <text x="865" y="62" text-anchor="middle" fill="#fbbf24" font-size="22" font-weight="900">🐍</text>
</svg>
