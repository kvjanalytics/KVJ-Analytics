<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js" type="text/javascript"></script>
</head>
<body>
    <script type="text/javascript">
        function testSkulpt(prog, expectedOutput, requirements = null) {
            console.log('--- Testing Code ---\n' + prog);
            const outputDiv = document.createElement('div'); // Mock output
            let outputText = "";
            
            Sk.configure({ 
                output: function(text) { 
                    outputText += text; 
                },
                read: function(x) {
                    if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                        throw "File not found: '" + x + "'";
                    return Sk.builtinFiles["files"][x];
                }
            });
            
            const myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, prog, true);
            });

            myPromise.then(function(mod) {
                console.log('Final Output:', outputText);
                let isCorrect = true;
                
                // 1. Output Match
                if (expectedOutput && !outputText.includes(expectedOutput)) {
                    isCorrect = false;
                    console.error('FAIL: Output mismatch. Expected: ' + expectedOutput);
                }

                // 2. Variable Validation
                if (requirements) {
                    for (const [varName, expectedVal] of Object.entries(requirements)) {
                        const pyVar = mod.$d[varName];
                        if (!pyVar) {
                            isCorrect = false;
                            console.error('FAIL: Variable not found: ' + varName);
                            break;
                        }
                        const jsVal = Sk.ffi.remapToJs(pyVar);
                        if (JSON.stringify(jsVal) !== JSON.stringify(expectedVal)) {
                            isCorrect = false;
                            console.error('FAIL Variable value mismatch. Variable: ' + varName + ', Got: ' + jsVal + ', Expected: ' + expectedVal);
                            break;
                        }
                    }
                }

                if (isCorrect) {
                    console.log('%c SUCCESS: Challenge Passed! ', 'background: #22c55e; color: white');
                } else {
                    console.log('%c FAILED: Challenge Not Passed. ', 'background: #ef4444; color: white');
                }
            });
        }

        // Test Case 1: Correct value
        testSkulpt("stock = 250\nprint(type(stock))", "<class 'int'>", {"stock": 250});
        
        // Test Case 2: Wrong value (But same output)
        setTimeout(() => {
            testSkulpt("stock = 251\nprint(type(stock))", "<class 'int'>", {"stock": 250});
        }, 500);

        // Test Case 3: Wrong variable name
        setTimeout(() => {
            testSkulpt("inventory = 250\nprint(type(inventory))", "<class 'int'>", {"stock": 250});
        }, 1000);
    </script>
</body>
</html>
