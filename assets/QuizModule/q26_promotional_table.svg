<svg width="400" height="420" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="420" fill="#0f172a" rx="12"/>
    <g fill="#1e293b" stroke="#334155" stroke-width="1">
        <rect x="20" y="20" width="360" height="40" fill="#1e293b"/>
        <rect x="20" y="60" width="360" height="340" fill="none"/>
        <!-- Rows -->
        <line x1="20" y1="100" x2="380" y2="100"/>
        <line x1="20" y1="140" x2="380" y2="140"/>
        <line x1="20" y1="180" x2="380" y2="180"/>
        <line x1="20" y1="220" x2="380" y2="220"/>
        <line x1="20" y1="260" x2="380" y2="260"/>
        <line x1="20" y1="300" x2="380" y2="300"/>
        <line x1="20" y1="340" x2="380" y2="340"/>
        <line x1="20" y1="380" x2="380" y2="380"/>
        <!-- Column Line -->
        <line x1="220" y1="20" x2="220" y2="400" stroke-width="2"/>
    </g>
    <g font-family="Outfit, sans-serif" font-size="14" fill="#f8fafc">
        <text x="35" y="45" font-weight="bold">Promotional Item</text>
        <text x="235" y="45" font-weight="bold">Quantity Distributed</text>
        
        <text x="35" y="85">T-shirt</text><text x="235" y="85">600</text>
        <text x="35" y="125">Shuffled Animal</text><text x="235" y="125">425</text>
        <text x="35" y="165">Drinkware</text><text x="235" y="165">550</text>
        <text x="35" y="205">Backpacks</text><text x="235" y="205">100</text>
        <text x="35" y="245">Blankets</text><text x="235" y="245">55</text>
        <text x="35" y="285">Magnets</text><text x="235" y="285">250</text>
        <text x="35" y="325">Gift cards</text><text x="235" y="325">50</text>
        <text x="35" y="365">Candy</text><text x="235" y="365">500</text>
        <text x="35" y="405">Notebooks</text><text x="235" y="405">450</text>
    </g>
</svg>
