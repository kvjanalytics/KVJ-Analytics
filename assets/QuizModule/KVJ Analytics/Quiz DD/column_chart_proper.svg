<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="500" fill="#0f172a" rx="24"/>
    <text x="400" y="50" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#f8fafc" letter-spacing="1">QUARTERLY REVENUE ANALYSIS</text>
    
    <!-- Grid Lines -->
    <line x1="100" y1="400" x2="700" y2="400" stroke="#1e293b" stroke-width="2"/>
    <line x1="100" y1="320" x2="700" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="100" y1="240" x2="700" y2="240" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="100" y1="160" x2="700" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="100" y1="80" x2="700" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- Y-Axis Labels -->
    <g font-family="'Outfit', sans-serif" font-size="14" fill="#64748b" font-weight="600">
        <text x="80" y="405" text-anchor="end">$0</text>
        <text x="80" y="325" text-anchor="end">$25k</text>
        <text x="80" y="245" text-anchor="end">$50k</text>
        <text x="80" y="165" text-anchor="end">$75k</text>
        <text x="80" y="85" text-anchor="end">$100k</text>
    </g>

    <!-- Bars with Gradients -->
    <defs>
        <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
        </linearGradient>
    </defs>

    <rect x="150" y="280" width="80" height="120" fill="url(#barGradient)" rx="8">
        <animate attributeName="height" from="0" to="120" dur="1s" fill="freeze" />
        <animate attributeName="y" from="400" to="280" dur="1s" fill="freeze" />
    </rect>
    <rect x="280" y="200" width="80" height="200" fill="url(#barGradient)" rx="8">
        <animate attributeName="height" from="0" to="200" dur="1s" fill="freeze" />
        <animate attributeName="y" from="400" to="200" dur="1s" fill="freeze" />
    </rect>
    <rect x="410" y="120" width="80" height="280" fill="url(#barGradient)" rx="8">
        <animate attributeName="height" from="0" to="280" dur="1s" fill="freeze" />
        <animate attributeName="y" from="400" to="120" dur="1s" fill="freeze" />
    </rect>
    <rect x="540" y="160" width="80" height="240" fill="url(#barGradient)" rx="8">
        <animate attributeName="height" from="0" to="240" dur="1s" fill="freeze" />
        <animate attributeName="y" from="400" to="160" dur="1s" fill="freeze" />
    </rect>

    <!-- X-Axis Labels -->
    <g font-family="'Outfit', sans-serif" font-size="16" fill="#f8fafc" font-weight="700">
        <text x="190" y="440" text-anchor="middle">Q1</text>
        <text x="320" y="440" text-anchor="middle">Q2</text>
        <text x="450" y="440" text-anchor="middle">Q3</text>
        <text x="580" y="440" text-anchor="middle">Q4</text>
    </g>

    <!-- Legend -->
    <rect x="650" y="470" width="12" height="12" fill="#38bdf8" rx="2"/>
    <text x="670" y="481" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">Revenue in USD</text>
</svg>
