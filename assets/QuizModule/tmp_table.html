<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  table {
    border-collapse: collapse;
    width: 600px;
    font-size: 18px;
  }
  th, td {
    border: 2px solid black;
    padding: 10px;
    text-align: center;
  }
  th {
    font-weight: bold;
    font-size: 20px;
  }
  td:first-child, th:first-child {
    text-align: left;
  }
</style>
</head>
<body>

<table>
  <tr>
    <th>Vehicle type</th>
    <th>Num Sold</th>
    <th>Price</th>
    <th>Total</th>
  </tr>
  <tr>
    <td>Motorized Bike</td>
    <td>600</td>
    <td>1200</td>
    <td>720000</td>
  </tr>
  <tr>
    <td>Golf Cart</td>
    <td>600</td>
    <td>7500</td>
    <td>4500000</td>
  </tr>
  <tr>
    <td>Utility Vehicle</td>
    <td>425</td>
    <td>8000</td>
    <td>3400000</td>
  </tr>
  <tr>
    <td>2-Wheel Scooter</td>
    <td>850</td>
    <td>900</td>
    <td>765000</td>
  </tr>
  <tr>
    <td>3-Wheel Scooter</td>
    <td>1200</td>
    <td>2999</td>
    <td>3598800</td>
  </tr>
  <tr>
    <td>4-Wheel Scooter</td>
    <td>789</td>
    <td>3500</td>
    <td>2761500</td>
  </tr>
  <tr>
    <td>Total</td>
    <td>4464</td>
    <td>24099</td>
    <td>15745300</td>
  </tr>
</table>

</body>
</html>
