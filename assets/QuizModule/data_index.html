<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVJ Advanced Data Analytics Certification - KVJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        .typing-container {
            display: inline-block;
            min-height: 2.2em;
            position: relative;
        }
        .text-blue-accent { color: #1e3a8a; font-weight: 800; }
        .blinking-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #1e3a8a; font-weight: 800;
            margin-left: 2px;
            animation: blink-caret 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink-caret {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="landing-body">
    <!-- Navbar -->
    <nav class="kvj-navbar">
        <div class="kvj-container nav-wrapper">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="index.html" class="nav-back">
                    Back
                </a>
                <a href="index.html" class="kvj-logo">
                    <div class="logo-box">
                        <img src="Kvj logo.jpeg" alt="KVJ" style="max-height: 45px; width: auto;">
                    </div>
                </a>
            </div>
            <div class="nav-links-right">
                <a href="data_intro.html" class="kvj-btn kvj-btn-primary">Get Started</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="kvj-hero">
        <div class="kvj-container hero-grid">
            
            <!-- Left Content -->
            <div class="hero-left fade-in-up" style="animation-delay: 0.1s;">
                <h1 class="hero-title typing-container">
                    <span id="typewriter"></span><span class="blinking-cursor"></span>
                </h1>
                
                <h2 class="hero-subtitle">
                    Pearson IT Specialist &amp; KVJ Certification
                </h2>
                
                <p class="hero-desc">
                    Master analytics, visualization, automation, and intelligent technologies designed for tomorrow’s professionals.
                </p>
                
                <div class="hero-action">
                    <a href="data_roadmap.html" class="kvj-btn kvj-btn-dark" style="background: #0ea5e9; box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);">LETS BEGIN</a>
                </div>
            </div>
            
            <!-- Right Content - Data Analysis Code Editor Graphic -->
            <div class="hero-right fade-in-up" style="animation-delay: 0.3s;">
            <div class="hero-right fade-in-up" style="animation-delay: 0.3s; display: flex; justify-content: center; align-items: center;">
                <img src="woman_presenting_dashboard.png" 
                     alt="Data Analytics Professional" 
                     style="width: 100%; max-width: 480px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1);">
            </div>
            </div>
            
        </div>
    </header>


    <script>
        // Typing Effect logic
        const textToType = "Shape the Future with Data Analytics";
        const typewriterEl = document.getElementById('typewriter');
        let typeIndex = 0;
        
        const blueStyle = "<span class='text-blue'>";
        const accentStyle = "<span class='text-blue-accent'>";
        const closeSpan = "</span>";
        
        // Break lines for impact
        const line1 = "Shape the Future ";
        const line2 = "with<br>";
        const line3 = "Data Analytics";

        let fullHTML = "";

        function typeWriter() {
            if (typeIndex < line1.length) {
                fullHTML = blueStyle + line1.substring(0, typeIndex + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 35);
            } 
            else if (typeIndex < line1.length + line2.length) {
                let idx2 = typeIndex - line1.length;
                fullHTML = blueStyle + line1 + closeSpan + accentStyle + line2.substring(0, idx2 + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 35);
            }
            else if (typeIndex < line1.length + line2.length + line3.length) {
                let idx3 = typeIndex - line1.length - line2.length;
                fullHTML = blueStyle + line1 + closeSpan + accentStyle + line2 + closeSpan + blueStyle + line3.substring(0, idx3 + 1) + closeSpan;
                typewriterEl.innerHTML = fullHTML;
                typeIndex++;
                setTimeout(typeWriter, 35);
            }
        }
        
        setTimeout(typeWriter, 400);
    </script>
</body>
</html>
